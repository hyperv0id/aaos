[package]
name = "aaos-session"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
blake3 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
tokio-rusqlite = "0.7.0"
pi-agent-core = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
