[package]
name = "aaos-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aaos"
path = "src/main.rs"

[dependencies]
aaos-catalog = { path = "../aaos-catalog" }
aaos-openai = { path = "../aaos-openai" }
aaos-session = { path = "../aaos-session" }
clap = { version = "4", features = ["derive"] }
pi-agent-core = { path = "../pi-agent-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
wiremock = "0.6"

[lints]
workspace = true
