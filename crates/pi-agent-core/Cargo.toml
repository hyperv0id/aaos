[package]
name = "pi-agent-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros"] }
futures = "0.3"
async-trait = "0.1"
serde_json = "1"
