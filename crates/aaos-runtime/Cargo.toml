[package]
name = "aaos-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
aaos-session = { workspace = true }
pi-agent-core = { workspace = true }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
