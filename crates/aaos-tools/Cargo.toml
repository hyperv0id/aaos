[package]
name = "aaos-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
pi-agent-core = { path = "../pi-agent-core" }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
