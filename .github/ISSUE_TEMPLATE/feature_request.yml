name: Feature Request
description: 提出新功能或增强建议
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！请先确认没有重复的 [现有 Issues](https://github.com/hyperv0id/aaos/issues)。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能要解决什么问题？用什么场景下遇到的？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望这个功能怎么工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你考虑过哪些其他方案？为什么不选它们？
