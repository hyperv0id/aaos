# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Warn on unmaintained crates (don't fail CI for transitively unmaintained deps)
unmaintained = "workspace"
# Ignore specific advisories with a reason:
# ignore = [
#   { id = "RUSTSEC-0000-0000", reason = "..." },
# ]

[bans]
# Warn on multiple versions of the same crate (strict deny is impractical for common
# transitive deps like getrandom, hashbrown, syn, windows-sys)
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "deny"
# Allow duplicate versions of these crates if unavoidable
# allow = [
#   { name = "windows-sys", version = "0.52" },
# ]

[licenses]
# Allow only permissive licenses
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
# Unlicensed crates and licenses not in `allow` are denied by default
# (cargo-deny v2 removed `unlicensed` / `allow-osi-fsf-free`).

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
# Deny git dependencies (prefer published crates)
unknown-git = "deny"
