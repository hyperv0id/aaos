[workspace]
members = [
    "crates/pi-agent-core",
    "crates/aaos-providers",
    "crates/aaos-cli",
    "crates/aaos-tools",
    "crates/aaos-session-store",
]
resolver = "2"

[workspace.dependencies]
pi-agent-core = { path = "crates/pi-agent-core", version = "0.1.0" }
aaos-providers = { path = "crates/aaos-providers", version = "0.1.0" }
aaos-tools = { path = "crates/aaos-tools", version = "0.1.0" }
aaos-session-store = { path = "crates/aaos-session-store", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"
